# 固定项目名：Compose 默认拿目录名推断，仓库名是 - 时会被过滤成空字符串，
# 报 "project name must not be empty"。显式指定后不受目录名影响。
name: qstheory

services:
  qstheory:
    build: .
    image: qstheory-notes:latest
    container_name: qstheory-notes
    restart: unless-stopped
    ports:
      - "5178:5178"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 宿主机 ./data 就是仓库里那份（含第 22 期成品），挂上去既能读到也能写入新生成的期号
      - ./data:/app/data
    # Chromium 在容器里对 /dev/shm 敏感，默认 64MB 会崩
    shm_size: 512m
